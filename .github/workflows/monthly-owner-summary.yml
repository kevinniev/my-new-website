name: Monthly Owner Summary

on:
  schedule:
    - cron: "0 7 1 * *"  # 1st of each month at 7 AM UTC
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger monthly-owner-summary endpoint
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://avfreelance.com/api/scheduled/monthly-owner-summary" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then echo "ERROR: $HTTP_CODE"; exit 1; fi
          echo "monthly-owner-summary completed successfully"
