name: Competitor Tracking Scan

on:
  schedule:
    - cron: "0 5 * * *"  # Daily at 5 AM UTC
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger competitor-tracking-scan endpoint
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://avfreelance.com/api/scheduled/competitor-tracking-scan" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then echo "ERROR: $HTTP_CODE"; exit 1; fi
          echo "competitor-tracking-scan completed successfully"
